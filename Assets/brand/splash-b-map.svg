<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Cold open option B · Map and title (preview). In the app the back is one of ARAM's loading screen maps (by address), drifting
       slowly; here a stand-in. Intro: the title writes itself in, then the map keeps drifting and the light sweeps over the title. -->
  <defs>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A4A6B"/><stop offset="0.5" stop-color="#5B6F8F"/><stop offset="1" stop-color="#2A2438"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D0E13" stop-opacity="0.2"/><stop offset="0.55" stop-color="#0D0E13" stop-opacity="0.55"/><stop offset="1" stop-color="#0D0E13" stop-opacity="0.95"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="title"><text x="195" y="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="4">MORELLONOMICON</text></clipPath>
  </defs>
  <!-- the map, slow Ken Burns drift -->
  <g>
    <rect x="-80" y="-60" width="600" height="980" fill="url(#map)"/>
    <path d="M-80 520 Q120 420 300 470 T560 430 V920 H-80 Z" fill="#23304A" opacity="0.8"/>
    <path d="M-80 380 L60 250 L160 340 L260 220 L400 330 L560 260 V500 H-80 Z" fill="#2B3854" opacity="0.6"/>
    <text x="195" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#C9C5B8" opacity="0.7">ARAM loading screen map (by address)</text>
    <animateTransform attributeName="transform" type="translate" values="0 0; -60 -30; 0 0" dur="24s" repeatCount="indefinite"/>
  </g>
  <rect width="390" height="844" fill="url(#shade)"/>
  <!-- logo small, then title -->
  <svg x="163" y="470" width="64" height="64" viewBox="0 0 512 512">
  
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1D26"/><stop offset="1" stop-color="#12141B"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E2440"/><stop offset="1" stop-color="#1B1626"/></linearGradient>
    <radialGradient id="lglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E38B3A" stop-opacity="0.55"/><stop offset="1" stop-color="#E38B3A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#lbg)"/>
  
  <path d="M150 104 h220 a14 14 0 0 1 14 14 v284 a14 14 0 0 1 -14 14 h-220 z" fill="#E9DFC8"/>
  <path d="M370 118 v284" stroke="#C9BFA6" stroke-width="2"/><path d="M362 112 v296" stroke="#C9BFA6" stroke-width="2"/>
  
  <rect x="128" y="92" width="232" height="316" rx="18" fill="url(#cover)" stroke="#E38B3A" stroke-width="5"/>
  <rect x="128" y="92" width="34" height="316" rx="14" fill="#16121F"/>
  <path d="M162 92 v316" stroke="#E38B3A" stroke-width="3" opacity="0.7"/>
  
  <g fill="#E38B3A"><path d="M360 92 v40 l-40 -40 z"/><path d="M360 408 v-40 l-40 40 z"/></g>
  
  <circle cx="261" cy="250" r="92" fill="url(#lglow)"/>
  <circle cx="261" cy="250" r="72" fill="none" stroke="#E38B3A" stroke-width="4"/>
  <circle cx="261" cy="250" r="58" fill="none" stroke="#E38B3A" stroke-width="2" stroke-dasharray="6 9" opacity="0.8"/>
  <g stroke="#E38B3A" stroke-width="4" stroke-linecap="round">
    <path d="M261 170 v14"/><path d="M261 316 v14"/><path d="M181 250 h14"/><path d="M327 250 h14"/>
  </g>
  
  <path d="M215 250 q46 -42 92 0 q-46 42 -92 0 z" fill="#12141B" stroke="#F4F1E8" stroke-width="4"/>
  <circle cx="261" cy="250" r="15" fill="#E38B3A"/><circle cx="261" cy="250" r="6" fill="#12141B"/>
<animate attributeName="opacity" to="1" dur="0.8s" begin="0.3s" fill="freeze"/></svg>
  <text x="195" y="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="4" fill="#F4F1E8" opacity="0">MORELLONOMICON
    <animate attributeName="opacity" to="1" dur="1s" begin="0.8s" fill="freeze"/>
    <animate attributeName="letter-spacing" values="12;4" dur="1.4s" begin="0.8s" fill="freeze"/></text>
  <rect x="-100" y="570" width="80" height="40" fill="url(#sheen)" clip-path="url(#title)" opacity="0.7">
    <animate attributeName="x" values="-100;420" dur="1.6s" begin="2.4s;sweep.end+3s" id="sweep"/></rect>
  <text x="195" y="636" text-anchor="middle" font-family="'Noto Serif TC', 'PMingLiU', serif" font-size="18" letter-spacing="10" fill="#E38B3A" opacity="0">黑魔禁書
    <animate attributeName="opacity" to="1" dur="0.8s" begin="1.6s" fill="freeze"/></text>
  <text x="195" y="672" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#C9C5B8" opacity="0">召喚峽谷 · 隨機單中：大混戰
    <animate attributeName="opacity" to="0.8" dur="0.8s" begin="2s" fill="freeze"/></text>
  <text x="195" y="770" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15" letter-spacing="4" fill="#C9C5B8" opacity="0">輕觸進入
    <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.4s" begin="2.6s" repeatCount="indefinite"/></text>
</svg>
