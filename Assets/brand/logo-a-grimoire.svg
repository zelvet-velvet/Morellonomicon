<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Option A · Grimoire: a closed book seen from the front, a rune ring with an eye on its cover -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1D26"/><stop offset="1" stop-color="#12141B"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E2440"/><stop offset="1" stop-color="#1B1626"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E38B3A" stop-opacity="0.55"/><stop offset="1" stop-color="#E38B3A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- pages seen at the edge -->
  <path d="M150 104 h220 a14 14 0 0 1 14 14 v284 a14 14 0 0 1 -14 14 h-220 z" fill="#E9DFC8"/>
  <path d="M370 118 v284" stroke="#C9BFA6" stroke-width="2"/><path d="M362 112 v296" stroke="#C9BFA6" stroke-width="2"/>
  <!-- cover -->
  <rect x="128" y="92" width="232" height="316" rx="18" fill="url(#cover)" stroke="#E38B3A" stroke-width="5"/>
  <rect x="128" y="92" width="34" height="316" rx="14" fill="#16121F"/>
  <path d="M162 92 v316" stroke="#E38B3A" stroke-width="3" opacity="0.7"/>
  <!-- corner fittings -->
  <g fill="#E38B3A"><path d="M360 92 v40 l-40 -40 z"/><path d="M360 408 v-40 l-40 40 z"/></g>
  <!-- rune ring -->
  <circle cx="261" cy="250" r="92" fill="url(#glow)"/>
  <circle cx="261" cy="250" r="72" fill="none" stroke="#E38B3A" stroke-width="4"/>
  <circle cx="261" cy="250" r="58" fill="none" stroke="#E38B3A" stroke-width="2" stroke-dasharray="6 9" opacity="0.8"/>
  <g stroke="#E38B3A" stroke-width="4" stroke-linecap="round">
    <path d="M261 170 v14"/><path d="M261 316 v14"/><path d="M181 250 h14"/><path d="M327 250 h14"/>
  </g>
  <!-- eye -->
  <path d="M215 250 q46 -42 92 0 q-46 42 -92 0 z" fill="#12141B" stroke="#F4F1E8" stroke-width="4"/>
  <circle cx="261" cy="250" r="15" fill="#E38B3A"/><circle cx="261" cy="250" r="6" fill="#12141B"/>
</svg>
