<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Cold open option A · Rune circle (preview; the app builds it in CSS). Intro 0–2.4 s once, then the loop keeps playing until a tap. -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75"><stop offset="0" stop-color="#252034"/><stop offset="1" stop-color="#0D0E13"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E38B3A" stop-opacity="0.45"/><stop offset="1" stop-color="#E38B3A" stop-opacity="0"/></radialGradient>
    <circle id="ember" r="2.2" fill="#E5B567"/>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <!-- embers rising, looping -->
  <g opacity="0.8">
    <use href="#ember" x="60"><animate attributeName="y" values="860;300" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></use>
    <use href="#ember" x="140"><animate attributeName="y" values="860;260" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="2s" repeatCount="indefinite"/></use>
    <use href="#ember" x="250"><animate attributeName="y" values="860;320" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="1s" repeatCount="indefinite"/></use>
    <use href="#ember" x="330"><animate attributeName="y" values="860;280" dur="10s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="3s" repeatCount="indefinite"/></use>
    <use href="#ember" x="200"><animate attributeName="y" values="860;360" dur="6s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="4s" repeatCount="indefinite"/></use>
  </g>
  <g transform="translate(195 330)">
    <!-- glow breathes -->
    <circle r="150" fill="url(#glow)" opacity="0"><animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/><animate attributeName="r" values="140;160;140" dur="4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <!-- outer ring draws itself, then turns slowly -->
    <g>
      <circle r="120" fill="none" stroke="#E38B3A" stroke-width="2.5" stroke-dasharray="754" stroke-dashoffset="754"><animate attributeName="stroke-dashoffset" to="0" dur="1.4s" fill="freeze"/></circle>
      <circle r="104" fill="none" stroke="#E38B3A" stroke-width="1.5" stroke-dasharray="3 11" opacity="0"><animate attributeName="opacity" to="0.8" begin="0.8s" dur="0.6s" fill="freeze"/></circle>
      <g fill="#E38B3A" opacity="0"><animate attributeName="opacity" to="1" begin="1s" dur="0.6s" fill="freeze"/>
        <path d="M0 -128 l5 8 h-10 z"/><path d="M0 128 l5 -8 h-10 z"/><path d="M-128 0 l8 5 v-10 z"/><path d="M128 0 l-8 5 v-10 z"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" begin="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="140" fill="none" stroke="#9E86C8" stroke-width="1" opacity="0"><animate attributeName="opacity" to="0.5" begin="1s" dur="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="60s" repeatCount="indefinite"/></circle>
    <!-- the logo rises in the middle -->
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.9s" dur="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.85;1" begin="0.9s" dur="0.8s" fill="freeze"/>
      <svg x="-60" y="-60" width="120" height="120" viewBox="0 0 512 512">
  
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1D26"/><stop offset="1" stop-color="#12141B"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E2440"/><stop offset="1" stop-color="#1B1626"/></linearGradient>
    <radialGradient id="lglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E38B3A" stop-opacity="0.55"/><stop offset="1" stop-color="#E38B3A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#lbg)"/>
  
  <path d="M150 104 h220 a14 14 0 0 1 14 14 v284 a14 14 0 0 1 -14 14 h-220 z" fill="#E9DFC8"/>
  <path d="M370 118 v284" stroke="#C9BFA6" stroke-width="2"/><path d="M362 112 v296" stroke="#C9BFA6" stroke-width="2"/>
  
  <rect x="128" y="92" width="232" height="316" rx="18" fill="url(#cover)" stroke="#E38B3A" stroke-width="5"/>
  <rect x="128" y="92" width="34" height="316" rx="14" fill="#16121F"/>
  <path d="M162 92 v316" stroke="#E38B3A" stroke-width="3" opacity="0.7"/>
  
  <g fill="#E38B3A"><path d="M360 92 v40 l-40 -40 z"/><path d="M360 408 v-40 l-40 40 z"/></g>
  
  <circle cx="261" cy="250" r="92" fill="url(#lglow)"/>
  <circle cx="261" cy="250" r="72" fill="none" stroke="#E38B3A" stroke-width="4"/>
  <circle cx="261" cy="250" r="58" fill="none" stroke="#E38B3A" stroke-width="2" stroke-dasharray="6 9" opacity="0.8"/>
  <g stroke="#E38B3A" stroke-width="4" stroke-linecap="round">
    <path d="M261 170 v14"/><path d="M261 316 v14"/><path d="M181 250 h14"/><path d="M327 250 h14"/>
  </g>
  
  <path d="M215 250 q46 -42 92 0 q-46 42 -92 0 z" fill="#12141B" stroke="#F4F1E8" stroke-width="4"/>
  <circle cx="261" cy="250" r="15" fill="#E38B3A"/><circle cx="261" cy="250" r="6" fill="#12141B"/>
</svg>
    </g>
  </g>
  <!-- name -->
  <g text-anchor="middle" opacity="0"><animate attributeName="opacity" to="1" begin="1.6s" dur="0.8s" fill="freeze"/>
    <text x="195" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="4" fill="#F4F1E8">MORELLONOMICON</text>
    <text x="195" y="578" font-family="'Noto Serif TC', 'PMingLiU', serif" font-size="20" letter-spacing="10" fill="#E38B3A">黑魔禁書</text>
    <path d="M135 600 h120" stroke="#E38B3A" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- tap hint pulses forever -->
  <text x="195" y="770" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="15" letter-spacing="4" fill="#C9C5B8" opacity="0">輕觸進入
    <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.4s" begin="2.4s" repeatCount="indefinite"/></text>
</svg>
