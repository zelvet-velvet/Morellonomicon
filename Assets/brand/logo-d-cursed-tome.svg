<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Option D · Cursed tome, after the Morellonomicon item: a purple tome tilted, gold corners, three green slashes, green fire around -->
  <defs>
    <radialGradient id="dbg" cx="0.5" cy="0.5" r="0.7"><stop offset="0" stop-color="#1E2A1F"/><stop offset="1" stop-color="#0E1210"/></radialGradient>
    <radialGradient id="daura" cx="0.5" cy="0.5" r="0.5"><stop offset="0.45" stop-color="#7FCB4E" stop-opacity="0.5"/><stop offset="1" stop-color="#7FCB4E" stop-opacity="0"/></radialGradient>
    <linearGradient id="dcover" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B3F86"/><stop offset="0.6" stop-color="#3D2A5E"/><stop offset="1" stop-color="#261A3B"/></linearGradient>
    <linearGradient id="dslash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4FFB0"/><stop offset="0.5" stop-color="#9BE05A"/><stop offset="1" stop-color="#4E9A2E"/></linearGradient>
    <filter id="dsoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter><filter id="dsoft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="dblur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#dbg)"/>
  <!-- green fire behind -->
  <circle cx="256" cy="262" r="210" fill="url(#daura)"/>
  <g fill="#5FA83C" opacity="0.8" filter="url(#dsoft)"><path d="M96 420 C70 340 110 290 120 230 C140 280 160 300 168 330 C170 270 200 220 214 170 C236 240 230 280 236 300 Z"/><path d="M300 300 C310 250 300 190 330 130 C350 190 372 210 370 260 C390 230 400 200 420 180 C440 260 430 340 410 420 Z"/><path d="M120 440 C200 400 320 400 400 440 C330 470 190 470 120 440 Z"/></g><g fill="#A6E070" opacity="0.7" filter="url(#dsoft2)"><path d="M126 400 C112 350 130 310 140 270 C152 310 166 330 170 360 Z"/><path d="M382 400 C392 340 384 290 400 240 C414 300 416 350 404 400 Z"/></g>
  <g transform="rotate(-14 256 262)">
    <!-- pages -->
    <path d="M150 140 h208 a12 12 0 0 1 12 12 v236 a12 12 0 0 1 -12 12 h-208 z" fill="#CFC3A6"/>
    <path d="M362 150 v240 M354 146 v248" stroke="#9F947A" stroke-width="2"/>
    <!-- cover -->
    <rect x="128" y="128" width="222" height="264" rx="14" fill="url(#dcover)" stroke="#1A1226" stroke-width="4"/>
    <rect x="128" y="128" width="30" height="264" rx="12" fill="#2A1D40"/>
    <!-- gold corners -->
    <g fill="#C9A24A" stroke="#7A5E22" stroke-width="2">
      <path d="M350 128 v54 l-18 -6 v-30 h-30 l-6 -18 z"/>
      <path d="M350 392 v-54 l-18 6 v30 h-30 l-6 18 z"/>
      <path d="M158 128 h44 l-6 18 h-38 z"/><path d="M158 392 h44 l-6 -18 h-38 z"/>
    </g>
    <circle cx="341" cy="137" r="4" fill="#F0D58A"/><circle cx="341" cy="383" r="4" fill="#F0D58A"/>
  </g>
  <!-- three claw slashes, glowing -->
  <g filter="url(#dblur)" fill="#9BE05A" opacity="0.9"><path d="M214 126 Q242.8 237.2 166 404 Q174.8 237.2 214 126 Z"/><path d="M280 114 Q308.0 235.60000000000002 220 418 Q232.0 235.60000000000002 280 114 Z"/><path d="M342 146 Q366.4 246.8 288 398 Q302.4 246.8 342 146 Z"/></g>
  <g fill="url(#dslash)"><path d="M214 126 Q232.8 237.2 166 404 Q184.8 237.2 214 126 Z"/><path d="M280 114 Q298.0 235.60000000000002 220 418 Q242.0 235.60000000000002 280 114 Z"/><path d="M342 146 Q356.4 246.8 288 398 Q312.4 246.8 342 146 Z"/></g>
  <g fill="#F2FFD8" opacity="0.85"><path d="M214 126 Q214.8 237.2 166 404 Q202.8 237.2 214 126 Z"/><path d="M280 114 Q277.0 235.60000000000002 220 418 Q263.0 235.60000000000002 280 114 Z"/><path d="M342 146 Q339.4 246.8 288 398 Q329.4 246.8 342 146 Z"/></g>
</svg>
